[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lllars"
version = "0.1.0"
description = "LLLars - local single-shot coding agent harness"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "LLLars Contributors" }]
dependencies = [
  "pydantic-ai>=0.0.20",
  "pydantic-ai-todo",
  "fastapi>=0.110.0",
  "PyYAML>=6.0",
  "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dev = [
  "black>=25.0.0",
  "flake8>=7.0.0",
]

[project.scripts]
lllars = "lllars:main"

[tool.setuptools]
py-modules = ["lllars"]

[tool.setuptools.packages.find]
include = ["lllars_core*"]
