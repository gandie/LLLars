services:
  lllars-runtime:
    build:
      context: .
      dockerfile: Dockerfile.runtime
    image: lllars/runtime:local
    env_file:
      - .env.runtime
    environment:
      LLLARS_RUNTIME_STARTUP_DIAGNOSTICS: "${LLLARS_RUNTIME_STARTUP_DIAGNOSTICS:-true}"
    ports:
      - "${LLLARS_PORT:-8000}:${LLLARS_PORT:-8000}"
    volumes:
      - lllars-work:/work
      - lllars-config:/config
      - lllars-artifacts:/artifacts
      - ./.env.runtime:/config/.env.runtime:ro
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  lllars-work:
  lllars-config:
  lllars-artifacts:
